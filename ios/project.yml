# xcodegen project definition for the Choreographr GUI iOS app.
#
# Generates Choreographr.xcodeproj from this file + ios/Info.plist +
# ios/main.m plus the Rust artifacts staged by scripts/build-ios.sh under
# target/ios/aarch64-apple-ios/<profile>/ (libchoreo_gui.rlib plus the
# native libs its build scripts produced: ring, secp256k1).
#
# On a Mac:
#   ./scripts/build-ios.sh            # build + stage (device target)
#   brew install xcodegen
#   cd ios && xcodegen generate
#   open Choreographr.xcodeproj       # then run on simulator/device
#
# The rlib is linked directly rather than via a `staticlib` crate-type: the
# Xcode "Other Linker" entry consumes it together with the C-compiled
# static archives staged alongside (see build-ios.sh's STAGE layout). If the
# Xcode link proves happier with a staticlib, add `staticlib` to choreo-gui's
# crate-type list and switch LIBRARIES below — one-line change either way.
#
# PHASE 0B: unverified on a Mac — expect iteration on the framework list
# (wgpu/Metal pulls QuartzCore/CoreGraphics/Metal; winit pulls UIKit/
# Foundation) and on the deployment-target floor (winit requires iOS 10+;
# 14.0 chosen conservatively for the local-network permission API).

name: Choreographr
options:
  bundleIdPrefix: com.choreographr
  deploymentTarget:
    iOS: "14.0"
targets:
  Choreographr:
    type: application
    platform: iOS
    sources:
      - path: main.m
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choreographr.gui
        PRODUCT_NAME: choreo-gui
        # Rust artifacts staged by scripts/build-ios.sh (relative to ios/).
        # Hardcoded `debug` (the script's default PROFILE), NOT $(CONFIGURATION):
        # cargo's target dir is lowercase `debug` while Xcode's Debug config
        # expands to `Debug` — the case mismatch would silently miss the lib
        # search path. A release-configured app build must pass PROFILE=dist
        # to build-ios.sh and point this at `dist` instead.
        # The Rust staticlib (staged by build-ios.sh) is SELF-CONTAINED: it
        # embeds std, ring, and secp256k1, so only `-lchoreo_gui` is needed
        # here (linking the ring/secp archives separately would be redundant).
        # -lobjc for the Rust ObjC bindings (objc2 family); the -framework
        # list mirrors rustc's own link args for this dep tree (wgpu→Metal/
        # QuartzCore/CoreGraphics, winit→UIKit/CoreFoundation, blitz→CoreText,
        # security-framework→Security).
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../target/ios/aarch64-apple-ios/debug"
        OTHER_LDFLAGS:
          - -lchoreo_gui
          - -lobjc
          - -framework
          - Metal
          - -framework
          - QuartzCore
          - -framework
          - CoreGraphics
          - -framework
          - CoreText
          - -framework
          - CoreFoundation
          - -framework
          - Foundation
          - -framework
          - UIKit
          - -framework
          - Security
        CLANG_ENABLE_MODULES: YES
        SWIFT_VERSION: "5.0"
