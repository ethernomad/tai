# xcodegen project definition for the Choreographr GUI iOS app.
#
# Generates Choreographr.xcodeproj from this file + ios/Info.plist +
# ios/main.m plus the SELF-CONTAINED Rust staticlib staged by
# scripts/build-ios.sh under target/ios/$(PLATFORM_NAME)/<profile>/
# (libchoreo_gui.a — std + ring + secp256k1 embedded).
#
# On a Mac:
#   ./scripts/build-ios.sh            # build + stage (device + simulator)
#   brew install xcodegen
#   cd ios && xcodegen generate
#   open Choreographr.xcodeproj       # then run on simulator/device
#
# The staticlib is linked via `-lchoreo_gui` (ld64 searches lib*.a for -l;
# it does NOT find .rlib — see build-ios.sh). The device vs simulator
# object formats are INCOMPATIBLE (ld64: "built for 'iOS', but building for
# 'iOS-simulator'"), hence the $(PLATFORM_NAME) stage split.
#
# PHASE 0B: the link is CI-verified (ios-build job); runtime boot still
# needs a Mac/device — expect iteration on the event-loop wiring
# (winit/blitz-shell iOS handshake, see ios/main.m) if launch misbehaves.

name: Choreographr
options:
  bundleIdPrefix: com.choreographr
  deploymentTarget:
    iOS: "14.0"
targets:
  Choreographr:
    type: application
    platform: iOS
    sources:
      - path: main.m
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choreographr.gui
        PRODUCT_NAME: choreo-gui
        # Rust staticlib stage root — per-SDK via $(PLATFORM_NAME): Xcode
        # expands it to `iphonesimulator`/`iphoneos` at build time, and the
        # two SDKs have INCOMPATIBLE object formats (ld64 refuses to link a
        # device-built archive into a simulator app: "building for
        # 'iOS-simulator', but linking in object file ... built for 'iOS'").
        # build-ios.sh stages into target/ios/<platform>/<profile>/.
        # cargo's dir is lowercase `debug` (the script's default PROFILE),
        # NOT $(CONFIGURATION)=`Debug` — the case mismatch would silently
        # miss the lib search path. A release-configured app build must pass
        # PROFILE=dist to build-ios.sh and point this at `dist` instead.
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../target/ios/$(PLATFORM_NAME)/debug"
        OTHER_LDFLAGS:
          - -lchoreo_gui
          - -lobjc
          - -framework
          - Metal
          - -framework
          - QuartzCore
          - -framework
          - CoreGraphics
          - -framework
          - CoreText
          - -framework
          - CoreFoundation
          - -framework
          - Foundation
          - -framework
          - UIKit
          - -framework
          - Security
        CLANG_ENABLE_MODULES: YES
        SWIFT_VERSION: "5.0"
